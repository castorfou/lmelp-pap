<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pap · accueil</title>
<!-- Accueil de l'appli pap (servi sur « / » par lmelp-pap arbitrer) : histogramme
     des émissions par année empilé par état, compteurs par état, frise des
     émissions dans son propre ascenseur, et une page de travail par état
     (#etat=…&annee=…). Données : GET /api/donnees. -->
<style>
  :root {
    --fond: #f6f5f1; --carte: #fff; --texte: #1f2328; --doux: #6b6f76; --trait: #dedcd5;
    --entete: #24292f; --entete-texte: #fff; --entete-doux: #aab; --ligne: #f0eee8; --vise: #24292f;
    --sans: #b9b4a8; --localise: #d9a441; --telechargeable: #e07b39; --rapatrie: #6aa7d8;
    --qualifie: #2f6fb2; --valide: #2a9d8f; --lmelp: #3c7d3a;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fond: #14171c; --carte: #1d2128; --texte: #e6e8eb; --doux: #9aa1ab; --trait: #2e333b;
      --entete: #0d1014; --entete-doux: #8a93a0; --ligne: #262b33; --vise: #e6e8eb;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --fond: #14171c; --carte: #1d2128; --texte: #e6e8eb; --doux: #9aa1ab; --trait: #2e333b;
    --entete: #0d1014; --entete-doux: #8a93a0; --ligne: #262b33; --vise: #e6e8eb;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font: 14px/1.4 system-ui, sans-serif; background: var(--fond); color: var(--texte); }
  header.app { display: flex; gap: 16px; align-items: baseline; padding: 12px 20px; background: var(--entete); color: var(--entete-texte); }
  header.app .logo { font-size: 16px; font-weight: 700; color: var(--entete-texte); text-decoration: none; }
  header.app span { color: var(--entete-doux); font-size: 12px; }
  header.app a.vers-liste { margin-left: auto; color: var(--entete-texte); font-size: 13px; text-decoration: none; border: 1px solid #fff4; border-radius: 6px; padding: 3px 10px; }
  header.app a.vers-liste:hover { background: #fff2; }
  main { max-width: 1180px; margin: 0 auto; padding: 16px 16px 0; }
  h2 { font-size: 15px; margin: 18px 0 8px; }
  .carte { background: var(--carte); border: 1px solid var(--trait); border-radius: 8px; padding: 12px; }
  .doux { color: var(--doux); font-size: 12px; }
  .alerte { background: var(--carte); border: 1px solid var(--localise); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--trait); background: var(--carte); color: var(--texte); border-radius: 6px; padding: 4px 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--trait); vertical-align: top; }
  th { font-weight: 600; color: var(--doux); font-size: 12px; }
  th.triable { cursor: pointer; user-select: none; white-space: nowrap; }
  th.triable:hover { color: var(--texte); }
  .pastille { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  svg text { font-size: 10px; fill: var(--doux); }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--entete); color: var(--entete-texte); padding: 10px 14px; border-radius: 8px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 30; }
  .toast.vu { opacity: 1; }

  /* Accueil : haut fixe, frise qui défile seule */
  .ecran { display: flex; flex-direction: column; min-height: 400px; }
  .haut { flex: none; padding-bottom: 8px; border-bottom: 2px solid var(--trait); }
  .compteurs { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 10px; }
  .compteur { background: var(--carte); color: var(--texte); border: 1px solid var(--trait); border-top: 5px solid; border-radius: 8px; padding: 6px 10px; text-align: left; }
  .compteur:hover { box-shadow: 0 2px 8px #0003; }
  .compteur .n { font-size: 20px; font-weight: 700; display: block; }
  .compteur .action { font-size: 11px; color: var(--doux); }
  #frise { flex: 1; overflow: auto; position: relative; padding: 10px 2px 8px; }
  .annee { margin-bottom: 10px; background: var(--carte); border: 1px solid var(--trait); border-radius: 8px; padding: 6px 10px; transition: box-shadow .2s; }
  .annee.vise { box-shadow: 0 0 0 3px var(--vise); }
  .annee-titre { font-weight: 700; display: flex; gap: 8px; align-items: center; }
  .mini { display: flex; flex: 1; height: 6px; border-radius: 3px; overflow: hidden; max-width: 260px; }
  .emi { padding: 2px 0; font-size: 13px; border-top: 1px solid var(--ligne); }
  .emi .jour { width: 44px; display: inline-block; }

  /* Page d'un état */
  .retour { margin-bottom: 8px; }
  /* Tâches en arrière-plan : panneau flottant en haut à droite (façon DSM) */
  #bandeau { position: fixed; top: 58px; right: 16px; width: 360px; max-width: calc(100vw - 32px); z-index: 25; background: var(--carte); color: var(--texte); border: 1px solid var(--trait); border-radius: 10px; box-shadow: 0 8px 28px #0004; padding: 10px 12px; display: grid; gap: 6px; font-size: 13px; }
  #bandeau .tete { display: flex; gap: 8px; align-items: center; }
  #bandeau .tete b { flex: 1; }
  #bandeau .icone { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--telechargeable); color: #fff; font-size: 12px; font-weight: 700; }
  #bandeau .tete button { padding: 2px 8px; font-size: 12px; }
  #bandeau .plier { border: 0; background: none; color: var(--doux); }
  #bandeau .corps { display: grid; gap: 4px; }
  #bandeau .rapatriees[title]:not([title=""]) { cursor: help; text-decoration: underline dotted var(--doux); }
  #bandeau .fichier { display: flex; justify-content: space-between; gap: 8px; }
  .barre { height: 6px; background: var(--ligne); border-radius: 3px; overflow: hidden; }
  .barre i { display: block; height: 100%; background: var(--telechargeable); transition: width .5s; }
  .barre.fine { height: 4px; } .barre.fine i { background: var(--rapatrie); }
  .erreurs { margin: 4px 0 0; padding-left: 18px; color: #b3261e; font-size: 13px; }
  .echec { color: #b3261e; font-size: 12px; }
  .ecart { color: var(--localise); font-size: 12px; font-weight: 600; }
  /* Lecteur d'un enregistrement rapatrié, sous sa ligne */
  tr.ecoute td { background: var(--ligne); }
  tr.ecoute .lecteur, tr.ecoute .verdict { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 4px 0; }
  tr.ecoute audio { flex: 1; min-width: 280px; height: 36px; }
  tr.ecoute .radiofrance { margin: 6px 0; display: grid; gap: 2px; }
  tr.ecoute .radiofrance a { color: var(--qualifie); justify-self: start; }
  tr.ecoute input { flex: 1; min-width: 220px; font: inherit; padding: 4px 8px; border: 1px solid var(--trait); border-radius: 6px; background: var(--carte); color: var(--texte); }
  .lot { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
  button.primaire { background: var(--entete); color: var(--entete-texte); border-color: var(--entete); }
  button:disabled { opacity: .5; cursor: wait; }
</style>
</head>
<body>
<header class="app"><a class="logo" href="/" id="logo">pap</a><span>Le Masque &amp; la Plume, archivage patrimonial</span><span id="resume"></span><a class="vers-liste" href="/liste">Liste et arbitrages</a></header>
<main id="accueil"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
// Les états d'une émission, dans l'ordre du chemin vers lmelp. « action » : ce que
// le compteur annonce ; l'action elle-même vit dans ACTIONS.
const ETATS = [
  { cle: "sans", nom: "sans enregistrement", action: "URL, piste ou fichier" },
  { cle: "localise", nom: "localisé", action: "Suivre la piste" },
  { cle: "telechargeable", nom: "téléchargeable", action: "Télécharger" },
  { cle: "rapatrie", nom: "rapatrié", action: "Écouter et qualifier" },
  { cle: "qualifie", nom: "qualifié", action: "Mettre à disposition de lmelp" },
  { cle: "valide", nom: "valide (attend lmelp)", action: null },
  { cle: "lmelp", nom: "dans lmelp", action: null },
];
const ETAT = Object.fromEntries(ETATS.map(e => [e.cle, e]));
// Les actions disponibles, par état : { libelle, lot, executer(emissions) }. La
// colonne Action et les boutons de lot n'apparaissent que pour un état qui en a une.
const ACTIONS = {
  telechargeable: { libelle: "Télécharger", lot: true, executer: ids => lancerRapatriement(ids) },
  // ouvre (ou referme) le lecteur sous la ligne de l'émission
  rapatrie: { libelle: "Écouter et qualifier", lot: false, executer: ids => { vue.ecoute = vue.ecoute === ids[0] ? null : ids[0]; rendre(); } },
};

// ---------- Écoute et qualification d'un enregistrement rapatrié ----------
// Le fichier vient de GET /audios/<fichier> (requêtes Range : le lecteur saute
// où on veut). Favorable : l'émission passe à qualifié ; Écarter (motif
// obligatoire) : elle reste rapatriée, marquée écartée.
const urlAudio = f => "/audios/" + f.split("/").map(encodeURIComponent).join("/");
function lecteur(e, colonnesN) {
  const corps = e.fichier
    ? `<audio controls preload="metadata" src="${esc(urlAudio(e.fichier))}"></audio>
       <button data-saut="-30">−30 s</button><button data-saut="30">+30 s</button>
       <span class="doux">${esc(e.fichier)}</span>`
    : `<span class="echec">aucun fichier écoutable pour cette émission</span>`;
  return `<tr class="ecoute"><td colspan="${colonnesN}"><div class="lecteur">${corps}</div>
    ${radiofrance(e)}
    <div class="verdict"><button class="primaire" id="favorable" ${e.fichier ? "" : "disabled"}>Favorable</button>
    <input id="motif" aria-label="Motif de l'écart" placeholder="motif de l'écart (obligatoire pour écarter)">
    <button id="ecarter" disabled>Écarter</button></div></td></tr>`;
}
// ---------- Écoute : page radiofrance.fr et diffusion de l'Open API Radio France ----------
// Les pages radiofrance.fr viennent des attestations ; la diffusion (équipe,
// invités, titre, chapô) est lue à l'ouverture par GET /api/radiofrance/<id>,
// gardée dans la mémoire de la page seulement (CGU de l'API).
const DIFFUSIONS = {};
const nomsRF = l => l.map(p => esc(p.nom) + (p.role ? ` (${esc(p.role)})` : "")).join(", ");
function radiofrance(e) {
  const liens = e.pages.map(p => `<a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer" title="${esc(p.titre)}">page radiofrance.fr ↗</a>`).join(" ");
  return `<div class="radiofrance">${liens}<div class="api">${diffusionRF(DIFFUSIONS[e.id])}</div></div>`;
}
function diffusionRF(r) {
  if (!r) return `<span class="doux">API Radio France : lecture…</span>`;
  if (r.statut === "sans_cle") return `<span class="doux">API Radio France : pas de clé (RADIOFRANCE_API_TOKEN), présentateur et critiques indisponibles.</span>`;
  if (r.statut === "introuvable") return `<span class="doux">API Radio France : aucune diffusion du Masque ce jour-là.</span>`;
  if (r.statut !== "trouvee" || !r.diffusion) return `<span class="doux">API Radio France indisponible${r.detail ? ` (${esc(r.detail)})` : ""}.</span>`;
  const d = r.diffusion;
  return (d.titre ? `<b>${esc(d.titre)}</b>` : "") + (d.resume ? `<div class="doux">${esc(d.resume)}</div>` : "") +
    (d.equipe.length ? `<div>Équipe : ${nomsRF(d.equipe)}</div>` : "") +
    (d.invites.length ? `<div>Invités : ${nomsRF(d.invites)}</div>` : "") +
    `<div class="doux">Données fournies par l'Open API Radio France.</div>`;
}
async function chargerDiffusion(id) {
  if (DIFFUSIONS[id]) return;
  try {
    const r = await fetch("/api/radiofrance/" + encodeURIComponent(id));
    const t = await r.json();
    DIFFUSIONS[id] = r.ok ? t : { statut: "erreur", detail: t.erreur || r.statusText };
  } catch (err) { DIFFUSIONS[id] = { statut: "erreur", detail: err.message }; }
  const bloc = document.querySelector("tr.ecoute .radiofrance .api");
  if (bloc && vue.ecoute === id) bloc.innerHTML = diffusionRF(DIFFUSIONS[id]);
}
function brancherLecteur(id) {
  chargerDiffusion(id);
  const audio = document.querySelector("tr.ecoute audio");
  document.querySelectorAll("tr.ecoute [data-saut]").forEach(b => b.addEventListener("click", () => {
    audio.currentTime = Math.max(0, audio.currentTime + +b.dataset.saut);
  }));
  const motif = $("motif"), ecarter = $("ecarter");
  motif.addEventListener("input", () => { ecarter.disabled = !motif.value.trim(); });
  motif.addEventListener("keydown", ev => { if (ev.key === "Enter" && motif.value.trim()) ecarter.click(); });
  $("favorable").addEventListener("click", () => qualifier(id, { verdict: "favorable" }));
  ecarter.addEventListener("click", () => qualifier(id, { verdict: "ecarte", motif: motif.value.trim() }));
}
async function qualifier(id, demande) {
  const avant = compter(EMISSIONS);
  document.querySelectorAll("tr.ecoute button").forEach(b => { b.disabled = true; });
  try {
    const r = await fetch("/api/qualifications", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ emission_id: id, ...demande }) });
    const t = await r.json();
    if (!r.ok) throw new Error(t.erreur || r.statusText);
    preparer(t); vue.ecoute = null; rendre();
    notifier(`${id} ${demande.verdict === "favorable" ? "qualifié" : "écarté"}`, avant);
  } catch (err) {
    toast(`Échec : ${err.message}`);
    document.querySelectorAll("tr.ecoute button").forEach(b => { b.disabled = b.id === "ecarter" && !$("motif").value.trim(); });
  }
}

// ---------- Rapatriements : un lot tourne côté serveur, le bandeau le suit ----------
// L'état vient de GET /api/rapatriements : le bandeau se retrouve après un
// rechargement ou depuis un autre poste. Un lot fini garde son bilan et ses
// erreurs jusqu'à « Fermer » (mémorisé par lot, dans ce navigateur).
const SUIVI = { etat: null, precedent: null, avant: null, minuterie: null, arret: false, replie: false };
const CLE_FERME = "pap-bandeau-ferme";
function lireFerme() { try { return localStorage.getItem(CLE_FERME); } catch { return null; } }
function ecrireFerme(v) { try { localStorage.setItem(CLE_FERME, v); } catch { /* sans stockage */ } }
const mo = n => `${Math.round((n || 0) / 1e6)} Mo`;
function duree(s) {
  if (!isFinite(s) || s < 0) return "…";
  if (s < 90) return `${Math.round(s)} s`;
  if (s < 5400) return `${Math.round(s / 60)} min`;
  return `${Math.floor(s / 3600)} h ${Math.round((s % 3600) / 60)} min`;
}
async function lancerRapatriement(ids) {
  SUIVI.avant = compter(EMISSIONS);
  try {
    const r = await fetch("/api/rapatriements", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ emissions: ids }) });
    const t = await r.json();
    if (!r.ok) throw new Error(t.erreur || r.statusText);
    SUIVI.etat = { en_cours: true }; SUIVI.arret = false;
    vue.choix.clear(); rendre();
    suivre(t);
  } catch (err) { toast(`Échec : ${err.message}`); }
}
async function suivre(t) {
  if (!t) {
    try { const r = await fetch("/api/rapatriements"); if (!r.ok) return; t = await r.json(); } catch { return; }
  }
  const etaitEnCours = !!(SUIVI.etat && SUIVI.etat.en_cours);
  SUIVI.precedent = SUIVI.etat && SUIVI.etat.octets !== undefined ? SUIVI.etat : null;
  SUIVI.etat = { ...t, quand: Date.now() };
  afficherBandeau();
  clearTimeout(SUIVI.minuterie);
  if (t.en_cours) { SUIVI.minuterie = setTimeout(() => suivre(), 1000); return; }
  SUIVI.arret = false;
  if (etaitEnCours) {
    const avant = SUIVI.avant || compter(EMISSIONS);
    try { preparer(await (await fetch("/api/donnees")).json()); } catch { /* garde les données */ }
    rendre();
    const b = t.bilan || {}, n = (b.rapatries || 0) + (b.deja_la || 0);
    notifier(`${n} rapatrié${n > 1 ? "s" : ""}${b.echecs ? ` · ${b.echecs} échec(s)` : ""}`, avant);
    SUIVI.avant = null;
  }
}
function afficherBandeau() {
  const t = SUIVI.etat;
  let b = $("bandeau");
  const visible = t && t.total && (t.en_cours || (t.bilan && lireFerme() !== t.debut));
  if (!visible) { if (b) b.remove(); return; }
  if (!b) { b = document.createElement("section"); b.id = "bandeau"; b.setAttribute("aria-live", "polite"); b.setAttribute("aria-label", "Tâches en arrière-plan"); document.body.append(b); }
  const plier = `<button class="plier" aria-label="${SUIVI.replie ? "Déplier" : "Replier"}" title="${SUIVI.replie ? "Déplier" : "Replier"}">${SUIVI.replie ? "▸" : "▾"}</button>`;
  if (t.en_cours) {
    const fraction = t.fichier_total ? t.fichier_octets / t.fichier_total : 0;
    const pct = t.fichier_total ? Math.round(fraction * 100) : null;
    const p = SUIVI.precedent;
    const debit = p && t.quand > p.quand ? Math.max(0, (t.octets - p.octets) / ((t.quand - p.quand) / 1000)) : null;
    const ecoule = (Date.now() - Date.parse(t.debut)) / 1000, faits = t.faites + fraction;
    const reste = faits > 0 ? ecoule / faits * (t.total - faits) : NaN;
    const global = Math.round(faits / t.total * 100);
    b.innerHTML = `<div class="tete"><span class="icone" aria-hidden="true">⇣</span><b>Téléchargement ${t.faites} / ${t.total}</b>${plier}` +
      `<button id="arreter" ${SUIVI.arret ? "disabled" : ""}>${SUIVI.arret ? "arrêt demandé…" : "Arrêter"}</button></div>` +
      `<div class="barre"><i style="width:${global}%"></i></div>` +
      (SUIVI.replie ? "" :
        `<div class="corps"><div class="doux">${mo(t.octets)} reçus · reste ~${duree(reste)}</div>` +
        `<div class="fichier"><span>${esc(t.en_cours_sur || "…")}</span><span class="doux">${pct !== null ? `${pct} %` : mo(t.fichier_octets)}${debit !== null ? ` · ${(debit / 1e6).toFixed(1).replace(".", ",")} Mo/s` : ""}</span></div>` +
        `<div class="barre fine"><i style="width:${pct ?? 0}%"></i></div></div>`);
    $("arreter").addEventListener("click", arreter);
  } else {
    const bl = t.bilan, n = bl.rapatries + bl.deja_la;
    b.innerHTML = `<div class="tete"><span class="icone" aria-hidden="true">${bl.echecs ? "!" : "✓"}</span><b>Téléchargement terminé${t.arrete ? " (arrêté)" : ""}</b>${plier}<button id="fermer-bandeau" aria-label="Fermer" title="Fermer">✕</button></div>` +
      (SUIVI.replie ? "" :
        `<div class="corps"><div><span class="rapatriees" title="${esc((t.rapatriees || []).join("\n"))}">${n} rapatrié${n > 1 ? "s" : ""}</span>${bl.echecs ? `, ${bl.echecs} échec(s)` : ""} <span class="doux">· ${mo(t.octets)} reçus</span></div>` +
        (t.erreurs && t.erreurs.length ? `<ul class="erreurs">${t.erreurs.map(e => `<li><b>${esc(e.emission)}</b> : ${esc(e.detail)}</li>`).join("")}</ul>` : "") + `</div>`);
    $("fermer-bandeau").addEventListener("click", () => { ecrireFerme(t.debut); afficherBandeau(); });
  }
  b.querySelector(".plier").addEventListener("click", () => { SUIVI.replie = !SUIVI.replie; afficherBandeau(); });
}
async function arreter() {
  SUIVI.arret = true; afficherBandeau();
  try { await fetch("/api/rapatriements/arret", { method: "POST" }); } catch { SUIVI.arret = false; afficherBandeau(); }
}
// La frise de l'accueil occupe la hauteur restante : à recalculer quand le
// bandeau apparaît, change ou disparaît.
function ajusterEcran() {
  const ecran = document.querySelector(".ecran");
  if (ecran) ecran.style.height = Math.max(400, innerHeight - ecran.getBoundingClientRect().top - 12) + "px";
}

const couleur = c => `var(--${c})`;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const JOUR_MS = 86400000;

let EMISSIONS = [], ANNEES = [], maturiteActive = false;
const vue = { annee: null, etat: null, survol: null, tri: null, sens: -1, choix: new Set(), ecoute: null };

// Une émission attestée par lmelp y est déjà : cet état l'emporte sur la maturité.
function etatDe(e) {
  if (e.attestations.some(a => a.source === "lmelp")) return "lmelp";
  return e.maturite || "sans";
}
function preparer(d) {
  maturiteActive = !!d.maturite_active;
  EMISSIONS = d.emissions.map(e => ({
    id: e.id, date: e.date, annee: +e.date.slice(0, 4), titre: e.titre || "Sans titre",
    themes: e.themes || [], sources: [...new Set(e.attestations.map(a => a.source))],
    etat: etatDe(e),
    echec: e.echec_rapatriement || null,
    fichier: e.fichier_audio || null, ecart: e.ecart || null,
    pages: e.attestations.filter(a => a.source === "radiofrance" && a.url).map(a => ({ url: a.url, titre: a.titre || "" })),
    depuis: e.maturite_depuis ? Math.max(0, Math.floor((Date.now() - Date.parse(e.maturite_depuis)) / JOUR_MS)) : null,
  }));
  const fin = Math.max(new Date().getFullYear(), ...EMISSIONS.map(e => e.annee));
  ANNEES = []; for (let a = 1955; a <= fin; a++) ANNEES.push(a);
}
function compter(liste) {
  const n = Object.fromEntries(ETATS.map(e => [e.cle, 0]));
  liste.forEach(e => n[e.etat]++);
  return n;
}
function parAnnee(liste) {
  const m = {}; ANNEES.forEach(a => m[a] = Object.fromEntries(ETATS.map(e => [e.cle, 0])));
  liste.forEach(e => m[e.annee][e.etat]++);
  return m;
}
// Un message bref ; « tenir » le garde affiché (avancement d'une tâche).
function toast(t, tenir = false) { const el = $("toast"); el.textContent = t; el.classList.add("vu"); clearTimeout(toast.t); if (!tenir) toast.t = setTimeout(() => el.classList.remove("vu"), 6000); }
// Après une action : les compteurs qui ont changé (« rapatrié 12→15 »).
function notifier(message, avant) {
  const apres = compter(EMISSIONS);
  const delta = ETATS.filter(s => apres[s.cle] !== avant[s.cle]).map(s => `${s.nom} ${avant[s.cle]}→${apres[s.cle]}`).join(" · ");
  toast(message + (delta ? " — " + delta : ""));
}
const depuis = e => {
  if (e.depuis === null || !ETAT[e.etat].action) return "";
  const c = e.depuis >= 45 ? "#b3261e" : e.depuis >= 21 ? "#9a6700" : "var(--doux)";
  return `<span style="color:${c};white-space:nowrap">${e.depuis} j</span>`;
};

// Histogramme par année. Empilé par état, ou une seule couleur (page d'un état).
// Une colonne transparente par année porte le survol et le clic.
function histogramme({ liste, hauteur, empile = true, surligne = null, annee = null, survol, clic }) {
  const m = parAnnee(liste), L = 1100, H = hauteur, pas = L / ANNEES.length;
  const total = a => ETATS.reduce((s, e) => s + m[a][e.cle], 0);
  const max = Math.max(1, ...ANNEES.map(total));
  let svg = `<svg id="histo" viewBox="-14 0 ${L + 28} ${H + 18}" width="100%" style="display:block">`;
  ANNEES.forEach((a, i) => {
    const x = i * pas + 1, w = pas - 2, hors = annee && annee !== a;
    let y = H;
    if (empile) {
      ETATS.forEach(e => {
        const h = m[a][e.cle] / max * H; if (!h) return; y -= h;
        const pale = (surligne && surligne !== e.cle) || hors;
        svg += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${couleur(e.cle)}" opacity="${pale ? .18 : 1}"></rect>`;
      });
    } else {
      const h = total(a) / max * H;
      if (h) svg += `<rect x="${x}" y="${H - h}" width="${w}" height="${h}" fill="${couleur(surligne)}" opacity="${hors ? .3 : 1}"></rect>`;
    }
    if (a % 5 === 0) svg += `<text x="${x + w / 2}" y="${H + 13}" text-anchor="middle">${a}</text>`;
    svg += `<rect class="zone" data-annee="${a}" x="${i * pas}" y="0" width="${pas}" height="${H}" fill="transparent" style="cursor:pointer"></rect>`;
  });
  const div = document.createElement("div"); div.innerHTML = svg + "</svg>";
  div.querySelectorAll("rect.zone").forEach(r => {
    const a = +r.dataset.annee;
    if (survol) { r.addEventListener("mouseenter", () => survol(a)); r.addEventListener("mouseleave", () => survol(null)); }
    if (clic) r.addEventListener("click", () => clic(a));
  });
  return div;
}
const legende = () => `<div class="doux" style="margin-top:4px">` + ETATS.map(e => `<span style="margin-right:12px"><span class="pastille" style="background:${couleur(e.cle)}"></span>${e.nom}</span>`).join("") + `</div>`;

// ---------- Accueil ----------
function accueil(racine) {
  const vues = EMISSIONS.filter(e => !vue.annee || e.annee === vue.annee), n = compter(vues);
  racine.innerHTML = `${maturiteActive ? "" : `<div class="alerte doux">Maturité indisponible : l'appli n'a pas de base Mongo (MONGO_URI absent). Seuls « sans enregistrement » et « dans lmelp » sont comptés.</div>`}
    <div class="ecran"><div class="haut"><div class="carte"><h2 style="margin-top:0">Émissions par année ${vue.annee ? `<button id="effacer-annee">${vue.annee} ×</button>` : ""}<span id="lecture" class="doux" style="font-weight:400"></span></h2><div id="h"></div>${legende()}</div>
    <div class="compteurs">${ETATS.map(e => `<button class="compteur" data-etat="${e.cle}" style="border-top-color:${couleur(e.cle)}"><span class="n">${n[e.cle]}</span>${e.nom}<br><span class="action">${e.action ? "→ " + e.action : "lecture seule"}</span></button>`).join("")}</div></div>
    <div id="frise"></div></div>`;
  const ecran = racine.querySelector(".ecran"), frise = $("frise");
  ajusterEcran();
  $("effacer-annee")?.addEventListener("click", () => { vue.annee = null; rendre(); });
  const repos = () => vue.annee ? ` — ${vues.length} émission(s) en ${vue.annee}` : " — survoler une année pour s'y rendre, cliquer pour filtrer";
  const dessiner = () => {
    const h = $("h"); h.innerHTML = "";
    h.append(histogramme({ liste: EMISSIONS, hauteur: 120, surligne: vue.survol, annee: vue.annee,
      clic: a => { vue.annee = vue.annee === a ? null : a; rendre(); },
      survol: a => {
        const lec = $("lecture");
        frise.querySelectorAll(".annee.vise").forEach(x => x.classList.remove("vise"));
        if (!a) { lec.textContent = repos(); return; }
        const l = EMISSIONS.filter(e => e.annee === a);
        lec.innerHTML = ` — <b>${a}</b> : ${l.length} · ` + ETATS.filter(s => l.some(e => e.etat === s.cle)).map(s => `<span class="pastille" style="background:${couleur(s.cle)}"></span>${l.filter(e => e.etat === s.cle).length} ${s.nom}`).join(" · ");
        const bloc = frise.querySelector(`.annee[data-annee="${a}"]`);
        if (bloc) { bloc.classList.add("vise"); frise.scrollTop = bloc.offsetTop; }
      } }));
  };
  dessiner(); $("lecture").textContent = repos();
  racine.querySelectorAll(".compteur").forEach(b => {
    b.addEventListener("click", () => ouvrir(b.dataset.etat));
    b.addEventListener("mouseenter", () => { vue.survol = b.dataset.etat; dessiner(); estomper(); });
    b.addEventListener("mouseleave", () => { vue.survol = null; dessiner(); estomper(); });
  });
  const estomper = () => frise.querySelectorAll(".emi").forEach(x => { x.style.opacity = !vue.survol || x.dataset.etat === vue.survol ? 1 : .2; });
  const groupes = {};
  vues.forEach(e => (groupes[e.annee] ??= []).push(e));
  Object.keys(groupes).sort((a, b) => b - a).forEach(a => {
    const l = groupes[a].sort((x, y) => y.date.localeCompare(x.date));
    const bloc = document.createElement("div"); bloc.className = "annee"; bloc.dataset.annee = a;
    bloc.innerHTML = `<div class="annee-titre">${a} <span class="doux">${l.length}</span> <span class="mini">${ETATS.map(s => { const k = l.filter(e => e.etat === s.cle).length; return k ? `<i style="flex:${k};background:${couleur(s.cle)}"></i>` : ""; }).join("")}</span></div>` +
      l.map(e => `<div class="emi" data-etat="${e.etat}"><span class="pastille" style="background:${couleur(e.etat)}"></span><span class="doux jour">${e.date.slice(5)}</span> ${esc(e.titre)} <span class="doux">· ${ETAT[e.etat].nom}${depuis(e) ? " · " + depuis(e) : ""}</span></div>`).join("");
    frise.append(bloc);
  });
}

// ---------- Page de travail d'un état ----------
function colonnes(cle) {
  const c = [
    { k: "date", t: "Date", v: e => e.date, h: e => e.date },
    { k: "titre", t: "Titre", v: e => e.titre.toLowerCase(), h: e => esc(e.titre) + (e.echec ? `<div class="echec">échec le ${new Date(e.echec.date).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }).replace(" ", " à ")} : ${esc(e.echec.detail)}</div>` : "") + (e.ecart ? `<div class="ecart" title="écarté le ${esc(new Date(e.ecart.date).toLocaleDateString("fr-FR"))}">écarté : ${esc(e.ecart.motif)}</div>` : "") },
    { k: "themes", t: "Thèmes", v: e => e.themes.join(","), h: e => `<span class="doux">${esc(e.themes.join(", "))}</span>` },
  ];
  if (cle !== "lmelp") {
    c.push({ k: "sources", t: "Sources", v: e => e.sources.join(","), h: e => `<span class="doux">${esc(e.sources.join(", "))}</span>` });
    c.push({ k: "depuis", t: "Depuis", v: e => e.depuis ?? -1, h: depuis });
  }
  return c;
}
function pageEtat(racine) {
  const s = ETAT[vue.etat], cols = colonnes(vue.etat), action = ACTIONS[vue.etat];
  const tri = cols.find(c => c.k === vue.tri) || cols[0];
  const tous = EMISSIONS.filter(e => e.etat === vue.etat);
  const liste = tous.filter(e => !vue.annee || e.annee === vue.annee)
    .sort((a, b) => { const x = tri.v(a), y = tri.v(b); return (x < y ? -1 : x > y ? 1 : 0) * vue.sens; });
  racine.innerHTML = `<button class="retour">← Accueil</button>
    <div class="carte"><h2 style="margin-top:0"><span class="pastille" style="background:${couleur(s.cle)}"></span>${s.nom} : ${liste.length} émission(s) ${vue.annee ? `en ${vue.annee} <button id="effacer-annee">× toutes les années</button>` : ""}</h2><div id="h"></div>
    <div class="doux">Cliquer une année filtre la liste.</div></div>
    ${action && action.lot ? `<div class="lot"><button class="primaire" id="lot-selection">${esc(action.libelle)} : sélection (${vue.choix.size})</button><button id="lot">${esc(action.libelle)} : tout (${liste.length})</button></div>` : ""}
    <div class="carte" style="margin-top:8px"><table><thead><tr>${action && action.lot ? `<th><input type="checkbox" id="tous" aria-label="Tout sélectionner"></th>` : ""}${cols.map(c => `<th class="triable" data-k="${c.k}">${c.t}${tri.k === c.k ? (vue.sens > 0 ? " ▲" : " ▼") : ""}</th>`).join("")}${action ? "<th>Action</th>" : ""}</tr></thead><tbody></tbody></table></div>`;
  racine.querySelector(".retour").addEventListener("click", () => { vue.etat = null; rendre(); scrollTo(0, 0); });
  $("effacer-annee")?.addEventListener("click", () => { vue.annee = null; rendre(); });
  racine.querySelectorAll("th.triable").forEach(th => th.addEventListener("click", () => {
    vue.sens = vue.tri === th.dataset.k ? -vue.sens : (th.dataset.k === "depuis" ? -1 : 1);
    vue.tri = th.dataset.k; rendre();
  }));
  $("h").append(histogramme({ liste: tous, hauteur: 90, empile: false, surligne: vue.etat, annee: vue.annee,
    clic: a => { vue.annee = vue.annee === a ? null : a; rendre(); } }));
  $("lot")?.addEventListener("click", () => {
    if (confirm(`${action.libelle} : les ${liste.length} émissions ?`)) action.executer(liste.map(e => e.id));
  });
  $("lot-selection")?.addEventListener("click", () => { if (vue.choix.size) action.executer([...vue.choix]); });
  $("tous")?.addEventListener("change", ev => { liste.forEach(e => ev.target.checked ? vue.choix.add(e.id) : vue.choix.delete(e.id)); rendre(); });
  const tb = racine.querySelector("tbody");
  const lot = action && action.lot;
  tb.innerHTML = liste.slice(0, 300).map(e => `<tr data-id="${esc(e.id)}">${lot ? `<td><input type="checkbox" ${vue.choix.has(e.id) ? "checked" : ""} aria-label="Sélectionner ${esc(e.date)}"></td>` : ""}${cols.map(c => `<td>${c.h(e)}</td>`).join("")}${action ? `<td><button data-action>${esc(action.libelle)}</button></td>` : ""}</tr>`).join("") +
    (liste.length > 300 ? `<tr><td colspan="6" class="doux">… ${liste.length - 300} de plus</td></tr>` : "");
  const ecoutee = vue.etat === "rapatrie" && liste.find(e => e.id === vue.ecoute);
  if (ecoutee) {
    const tr = tb.querySelector(`tr[data-id="${CSS.escape(ecoutee.id)}"]`);
    if (tr) { tr.insertAdjacentHTML("afterend", lecteur(ecoutee, tr.children.length)); brancherLecteur(ecoutee.id); }
  }
  if (action) tb.querySelectorAll("button[data-action]").forEach(b => b.addEventListener("click", () => action.executer([b.closest("tr").dataset.id])));
  if (lot) tb.querySelectorAll("input[type=checkbox]").forEach(c => c.addEventListener("change", () => {
    const id = c.closest("tr").dataset.id;
    c.checked ? vue.choix.add(id) : vue.choix.delete(id);
    $("lot-selection").textContent = `${action.libelle} : sélection (${vue.choix.size})`;
  }));
}

// ---------- Navigation : l'état ouvert et l'année filtrée vivent dans l'adresse ----------
function ouvrir(etat) {
  vue.etat = etat; vue.choix.clear(); vue.ecoute = null; vue.tri = ETAT[etat].action ? "depuis" : "date"; vue.sens = -1;
  rendre(); scrollTo(0, 0);
}
function lireAdresse() {
  const p = new URLSearchParams(location.hash.slice(1));
  vue.etat = ETAT[p.get("etat")] ? p.get("etat") : null;
  vue.annee = +p.get("annee") || null;
  if (vue.etat && !vue.tri) vue.tri = ETAT[vue.etat].action ? "depuis" : "date";
}
function ecrireAdresse() {
  const p = new URLSearchParams();
  if (vue.etat) p.set("etat", vue.etat);
  if (vue.annee) p.set("annee", vue.annee);
  const h = p.toString();
  history.replaceState(null, "", h ? "#" + h : location.pathname + location.search);
}
function rendre() {
  const n = compter(EMISSIONS);
  $("resume").textContent = `${EMISSIONS.length} émissions · ${n.lmelp} dans lmelp · ${n.valide} valides`;
  ecrireAdresse();
  (vue.etat ? pageEtat : accueil)($("accueil"));
}
// « pap » ramène à l'accueil, sans filtre ni page d'état.
$("logo").addEventListener("click", ev => { ev.preventDefault(); vue.etat = null; vue.annee = null; vue.choix.clear(); rendre(); scrollTo(0, 0); });
addEventListener("resize", () => { if (!vue.etat) rendre(); });
addEventListener("hashchange", () => { lireAdresse(); rendre(); });

fetch("/api/donnees").then(r => r.json()).then(d => { preparer(d); lireAdresse(); rendre(); suivre(); })
  .catch(err => { $("accueil").innerHTML = `<div class="alerte">Serveur injoignable : ${esc(err.message)}</div>`; });
</script>
