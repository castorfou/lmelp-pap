<!-- Mode arbitrage : ajouté à la page par « lmelp-pap arbitrer », absent de la page publiée. -->
<style>
.arbitrage { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 12px 16px; display: grid; gap: 8px; font-size: 14px; }
.arbitrage .titre-mode { font-weight: 600; color: var(--accent); }
.arbitrage .statut { min-height: 1.4em; }
.arbitrage .statut.echec { color: var(--alerte); font-weight: 600; }
.arbitrage summary { cursor: pointer; color: var(--muted); }
.arbitrage ul { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; max-height: 40vh; overflow-y: auto; }
.arbitrage li { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; overflow-wrap: anywhere; }
.arbitrage .meta { font-family: var(--f-data); font-size: 12px; color: var(--muted); }
.arb { display: grid; gap: 8px; border-top: 1px solid var(--rule); padding-top: 10px; }
.arb fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.arb legend, .arb .libelle { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-right: 6px; }
.arb label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.arb-raisons { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.arb-raisons input { font: inherit; font-size: 13px; flex: 1 1 220px; min-width: 0; padding: 5px 8px; border: 1px solid var(--rule); border-radius: 4px; background: var(--surface); color: var(--fg); }
.arb button, .arbitrage button { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 4px; border: 1px solid var(--rule); background: var(--surface); color: var(--fg); cursor: pointer; }
.arb .arb-raison[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.arb-dates { display: grid; gap: 4px; }
.arb-dates label { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.arb-dates .habituel { font-weight: 600; }
.arb-dates .indice { font-size: 12px; color: var(--accent); }
.arb-dates button { justify-self: start; }
.arb-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.arb .arb-principal { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.arb .arb-danger { color: var(--alerte); border-color: var(--alerte); }
.arb-doute { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.arb-doute button { font: inherit; font-size: 13px; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--rule); background: var(--surface); color: var(--fg); cursor: pointer; }
.maturite { font-size: 10.5px; padding: 1px 6px; border-radius: 3px; color: #fff; font-weight: 600; }
.maturite.localise { background: #b07c1e; } .maturite.telechargeable { background: #c8622a; }
.maturite.rapatrie { background: #3f7fb5; } .maturite.qualifie { background: #2f6fb2; } .maturite.valide { background: #2a9d8f; } .maturite.lmelp { background: #3c7d3a; }
.arb button:disabled, .arbitrage button:disabled, .arb-doute button:disabled { opacity: .5; cursor: wait; }
</style>
<script>
const THEMES = __THEMES__;  // lmelp_pap.arbitrages.THEMES
const HOMMAGE = __HOMMAGE__;  // lmelp_pap.liste.HOMMAGE
const RAISONS = ["titre explicite", "écouté l'enregistrement", "connaissance de l'émission"];

document.querySelector("header").insertAdjacentHTML("afterend",
  `<section class="arbitrage" id="arbitrage" aria-label="Mode arbitrage">` +
  `<div><span class="titre-mode">Mode arbitrage</span> · ouvrir une émission pour arbitrer son thème, son existence, sa date ou ses rapprochements, ou la renvoyer à l'écoute. ` +
  `Chaque décision est écrite dans <code>arbitrages.csv</code> et la liste est reconstruite aussitôt.</div>` +
  `<div class="statut" id="arb-statut" role="status" aria-live="polite"></div>` +
  `<details><summary>Arbitrages enregistrés (<span id="arb-nombre">…</span>)</summary><ul id="arb-journal"></ul></details>` +
  `</section>`);

// Le choix de la date d'une émission qui a un doute de date : chaque date que
// donnent les sources, avec son jour et ses sources ; le jour habituel est signalé.
function choixDate(e) {
  const candidates = e.dates_candidates || [];
  if (!candidates.length) return "";
  const choix = candidates.map(c => {
    const indices = [c.actuelle && "date actuelle", c.habituel && "jour habituel"].filter(Boolean);
    return `<label><input type="radio" name="date-${esc(e.id)}" value="${esc(c.date)}"${c.actuelle ? " checked data-actuelle" : ""}>` +
      ` <b>${esc(c.date)}</b> <span class="${c.habituel ? "habituel" : ""}">${esc(c.jour)}</span>` +
      ` <span class="meta">${c.sources.map(s => NOMS[s] || esc(s)).join(", ")}</span>` +
      (indices.length ? ` <span class="indice">← ${indices.join(" · ")}</span>` : "") + `</label>`;
  }).join("");
  return `<fieldset class="arb-dates"><legend>Date de première diffusion</legend>${choix}` +
    `<button type="button" class="arb-principal" data-action="date">Retenir cette date</button></fieldset>`;
}

// Les contrôles d'un rapprochement ambigu, sur la ligne de son doute : garder
// l'attestation dans l'émission, ou la déplacer vers une émission rivale.
function controlesDoute(e, source, sourceId) {
  const r = (e.rapprochements || []).find(x => x.source === source && x.source_id === sourceId);
  if (!r) return "";
  const attributs = `data-id="${esc(e.id)}" data-source="${esc(source)}" data-source-id="${esc(sourceId)}"`;
  return `<div class="arb-doute">` +
    `<button type="button" data-rapprochement ${attributs}>Garder ici</button>` +
    r.rivales.map(v => `<button type="button" data-rapprochement data-vers="${esc(v)}" ${attributs}>Déplacer vers ${esc(v)}</button>`).join("") +
    `</div>`;
}

// Les contrôles d'arbitrage d'une émission, sous son détail.
function controlesArbitrage(e) {
  const coches = THEMES.map(t =>
    `<label><input type="checkbox" value="${esc(t)}"${e.themes.includes(t) ? " checked" : ""}> ${esc(t)}</label>`).join("");
  const raisons = RAISONS.map(r =>
    `<button type="button" class="arb-raison" data-raison="${esc(r)}" aria-pressed="false">${esc(r)}</button>`).join("");
  const dateArbitree = e.arbitrage_date ?
    `<p class="meta">Date arbitrée${e.arbitrage_date.justification ? " · " + esc(e.arbitrage_date.justification) : ""}</p>` : "";
  const existenceArbitree = e.arbitrage_existence ?
    `<p class="meta">Existence arbitrée${e.arbitrage_existence.justification ? " · " + esc(e.arbitrage_existence.justification) : ""}</p>` : "";
  return `<div class="arb" data-id="${esc(e.id)}">` + existenceArbitree + dateArbitree + choixDate(e) +
    `<fieldset class="arb-themes"><legend>Thèmes</legend>${coches}</fieldset>` +
    `<div class="arb-raisons"><span class="libelle">Justification</span>${raisons}` +
    `<input type="text" class="arb-texte" placeholder="ou texte libre (facultatif)" aria-label="Justification libre"></div>` +
    `<div class="arb-actions">` +
    `<button type="button" class="arb-principal" data-action="theme">Arbitrer le thème</button>` +
    `<button type="button" data-action="existe">Existe</button>` +
    `<button type="button" class="arb-danger" data-action="existence">N'existe pas</button>` +
    `<button type="button" data-action="ecoute">À écouter</button>` +
    (e.arbitrage || e.arbitrage_date || e.arbitrage_existence ? `<button type="button" data-action="annuler">Annuler l'arbitrage</button>` : "") +
    `</div></div>`;
}

function statut(texte, echec = false) {
  const s = $("arb-statut");
  s.textContent = texte;
  s.classList.toggle("echec", echec);
}

function dateDecision(d) { return d.slice(0, 16).replace("T", " ").replace(/ 00:00$/, ""); }

function journal(arbitrages) {
  $("arb-nombre").textContent = arbitrages.length;
  $("arb-journal").innerHTML = arbitrages.length ? arbitrages.map(a =>
    `<li><span class="meta">${esc(dateDecision(a.date))}</span>` +
    `<b>${esc(a.attestation ? a.attestation.date : "attestation introuvable")}</b>` +
    `<span>${esc(a.attestation && a.attestation.titre || "")}</span>` +
    `<span class="meta">${NOMS[a.source] || esc(a.source)} · ${esc(a.source_id)}</span>` +
    `<span>→ ${esc(a.valeur)}${a.justification ? ` (${esc(a.justification)})` : ""}</span>` +
    `<button type="button" data-source="${esc(a.source)}" data-source-id="${esc(a.source_id)}">Annuler</button></li>`
  ).join("") : `<li class="meta">Aucun arbitrage.</li>`;
}

// Maturité des enregistrements (avec une base Mongo seulement) : badge, filtre et
// vérification des URL d'intégral.
// Une émission attestée par lmelp y est déjà : cet état l'emporte sur la maturité
// de ses enregistrements.
const MATURITES = { localise: "localisé", telechargeable: "téléchargeable", rapatrie: "rapatrié", qualifie: "qualifié", valide: "valide", lmelp: "dans lmelp" };
let maturiteActive = false;
const etatEmission = e => (e.sources.includes("lmelp") ? "lmelp" : e.maturite || null);
function badgeMaturite(e) {
  const m = maturiteActive && etatEmission(e);
  return m ? `<span class="maturite ${esc(m)}">${MATURITES[m] || esc(m)}</span>` : "";
}
function passeMaturite(e) {
  const m = maturiteActive ? $("maturite").value : "";
  if (!m) return true;
  return m === "aucune" ? !etatEmission(e) : etatEmission(e) === m;
}
function filtreMaturite() {
  if (!maturiteActive || !$("maturite").value) return [];
  return [[`Maturité : ${$("maturite").selectedOptions[0].textContent.toLowerCase()}`, () => { $("maturite").value = ""; }]];
}
function effacerMaturite() { if (maturiteActive) $("maturite").value = ""; }
function activerMaturite() {
  if (maturiteActive) return;
  maturiteActive = true;
  $("effacer").insertAdjacentHTML("beforebegin",
    `<label class="champ" for="maturite">Maturité<select id="maturite"><option value="">Toutes</option>` +
    Object.entries(MATURITES).map(([v, t]) => `<option value="${v}">${t}</option>`).join("") +
    `<option value="aucune">Sans enregistrement suivi</option></select></label>`);
  $("maturite").addEventListener("change", () => { etat.affichees = LOT; rendre(); });
  $("arb-statut").insertAdjacentHTML("beforebegin",
    `<div><button type="button" id="arb-verifier">Vérifier les URL des intégraux</button> ` +
    `<span class="meta">une URL qui répond avec un son rend l'enregistrement téléchargeable</span></div>`);
  $("arb-verifier").addEventListener("click", verifierUrls);
}
const pause = ms => new Promise(r => setTimeout(r, ms));
async function verifierUrls() {
  const b = $("arb-verifier"); b.disabled = true;
  try {
    let r = await fetch("/api/verifications", { method: "POST" });
    let v = await r.json();
    if (!r.ok) throw new Error(v.erreur || r.statusText);
    while (v.en_cours) {
      statut(`Vérification des URL : ${v.faites} / ${v.total}…`);
      await pause(1000);
      v = await (await fetch("/api/verifications")).json();
    }
    appliquer(await (await fetch("/api/donnees")).json());
    const n = v.bilan || {};
    statut(`${v.total} URL vérifiées : ${n.ok || 0} téléchargeables, ${n.net || 0} mortes (→ localisé), ${n.passager || 0} échecs passagers.`);
  } catch (err) {
    statut(`Échec de la vérification : ${err.message}`, true);
  } finally { b.disabled = false; }
}

// Remplace les données de la page par celles que renvoie le serveur.
function appliquer(d) {
  if (d.maturite_active) activerMaturite();
  emissions = preparer(d.emissions);
  if (!emissions.some(e => e.id === etat.ouverte)) etat.ouverte = null;
  remplirFiltres(); chiffres(); rendre(); journal(d.arbitrages);
}

async function envoyer(chemin, corps, message) {
  document.querySelectorAll(".arb button, .arbitrage button, .arb-doute button").forEach(b => { b.disabled = true; });
  statut("Enregistrement…");
  try {
    const r = await fetch(chemin, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corps) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.erreur || r.statusText);
    appliquer(d);
    statut(message(d));
  } catch (err) {
    statut(`Échec : ${err.message}`, true);
    document.querySelectorAll(".arb button, .arbitrage button, .arb-doute button").forEach(b => { b.disabled = false; });
  }
}

const encore = (d, id) => d.emissions.some(e => e.id === id);

$("lignes").addEventListener("click", ev => {
  const rapprochement = ev.target.closest("button[data-rapprochement]");
  if (rapprochement) {
    const { id, source, sourceId } = rapprochement.dataset;
    const vers = rapprochement.dataset.vers || null;
    const champ = rapprochement.closest(".detail").querySelector(".arb-texte");
    envoyer("/api/arbitrages",
      { emission_id: id, sorte: "rapprochement", source, source_id: sourceId, vers, justification: champ ? champ.value.trim() : "" },
      () => `${NOMS[source] || source} · ${sourceId} : ` + (vers ? `déplacée vers ${vers}.` : `gardée ici, dans ${id}.`));
    return;
  }
  const bloc = ev.target.closest(".arb"); if (!bloc) return;
  const id = bloc.dataset.id, champ = bloc.querySelector(".arb-texte");
  const raison = ev.target.closest(".arb-raison");
  if (raison) {
    const active = raison.getAttribute("aria-pressed") === "true";
    bloc.querySelectorAll(".arb-raison").forEach(b => b.setAttribute("aria-pressed", "false"));
    raison.setAttribute("aria-pressed", String(!active));
    champ.value = active ? "" : raison.dataset.raison;
    return;
  }
  const bouton = ev.target.closest("button[data-action]"); if (!bouton) return;
  const justification = champ.value.trim();
  if (bouton.dataset.action === "theme") {
    const themes = [...bloc.querySelectorAll(".arb-themes input[type=checkbox]:checked")].map(c => c.value);
    if (!themes.length) { statut("Cocher au moins un thème.", true); return; }
    envoyer("/api/arbitrages", { emission_id: id, sorte: "thème", themes, justification }, d =>
      `${id} : thème arbitré ${themes.join(" + ")}` + (encore(d, id) ? "." : ", l'émission sort de la liste."));
  } else if (bouton.dataset.action === "existence") {
    envoyer("/api/arbitrages", { emission_id: id, sorte: "existence", valeur: "n'existe pas", justification }, () =>
      `${id} : arbitrée inexistante, l'émission sort de la liste.`);
  } else if (bouton.dataset.action === "existe") {
    envoyer("/api/arbitrages", { emission_id: id, sorte: "existence", valeur: "existe", justification }, () =>
      `${id} : arbitrée existante, ses doutes d'existence sont levés.`);
  } else if (bouton.dataset.action === "date") {
    const choisie = bloc.querySelector(".arb-dates input[type=radio]:checked");
    if (!choisie) { statut("Choisir une date.", true); return; }
    const date = choisie.value;
    envoyer("/api/arbitrages", { emission_id: id, sorte: "date", date, justification }, () =>
      `${id} : date retenue ${date}` + (choisie.hasAttribute("data-actuelle") ? ", l'exception est confirmée." : `, l'émission devient ${date}.`));
  } else if (bouton.dataset.action === "ecoute") {
    envoyer("/api/arbitrages", { emission_id: id, sorte: "écoute", justification }, () =>
      `${id} : renvoyée à l'écoute, ses doutes sont « à écouter ».`);
  } else {
    envoyer("/api/annulations", { emission_id: id }, () => `${id} : arbitrage annulé.`);
  }
});
// Le thème hommage ne se cumule avec aucun autre : le cocher décoche les autres,
// et inversement.
$("lignes").addEventListener("change", ev => {
  const coche = ev.target.closest(".arb input[type=checkbox]");
  if (!coche || !coche.checked) return;
  const hommage = coche.value === HOMMAGE;
  coche.closest("fieldset").querySelectorAll("input[type=checkbox]").forEach(c => {
    if (c !== coche && (hommage || c.value === HOMMAGE)) c.checked = false;
  });
});
// Une émission sortie de la liste s'annule depuis la liste des arbitrages.
$("arb-journal").addEventListener("click", ev => {
  const b = ev.target.closest("button[data-source]"); if (!b) return;
  const { source, sourceId } = b.dataset;
  envoyer("/api/annulations", { source, source_id: sourceId }, d =>
    `Arbitrage de ${NOMS[source] || source} · ${sourceId} annulé · ${d.emissions.length} émissions dans la liste.`);
});

fetch("/api/donnees").then(r => r.json()).then(appliquer)
  .catch(err => statut(`Serveur injoignable : ${err.message}`, true));
</script>
