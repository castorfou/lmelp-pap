<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE accueil pap</title>
<!-- PROTOTYPE jetable (#85, second tour de #82) : trois variantes de l'accueil
     retenu (A : tableau de bord + page par état), graphique au survol et liste
     globale sous les compteurs, ?variant=A|B|C. Actions simulées en mémoire, rien n'est écrit. -->
<style>
  :root {
    --fond: #f6f5f1; --carte: #fff; --texte: #1f2328; --doux: #6b6f76; --trait: #dedcd5;
    --sans: #b9b4a8; --localise: #d9a441; --telechargeable: #e07b39;
    --rapatrie: #6aa7d8; --qualifie: #2f6fb2; --valide: #2a9d8f; --lmelp: #3c7d3a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--fond); color: var(--texte); padding-bottom: 80px; }
  header.app { display: flex; gap: 16px; align-items: baseline; padding: 12px 20px; background: #24292f; color: #fff; }
  header.app b { font-size: 16px; } header.app span { color: #aab; font-size: 12px; }
  main { max-width: 1180px; margin: 0 auto; padding: 16px; }
  h2 { font-size: 15px; margin: 18px 0 8px; }
  .carte { background: var(--carte); border: 1px solid var(--trait); border-radius: 8px; padding: 12px; }
  .doux { color: var(--doux); font-size: 12px; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--trait); background: #fff; border-radius: 6px; padding: 4px 10px; }
  button.primaire { background: #24292f; color: #fff; border-color: #24292f; }
  button:disabled { opacity: .45; cursor: default; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--trait); vertical-align: top; }
  th { font-weight: 600; color: var(--doux); font-size: 12px; }
  .pastille { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .etiquette { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 10px; color: #fff; white-space: nowrap; }
  .simule { font-size: 10px; color: var(--doux); border: 1px dashed var(--doux); border-radius: 4px; padding: 0 4px; margin-left: 4px; }
  .toast { position: fixed; top: 60px; right: 20px; background: #24292f; color: #fff; padding: 10px 14px; border-radius: 8px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 30; }
  .toast.vu { opacity: 1; }
  .flash { animation: flash 1.2s; } @keyframes flash { 0% { box-shadow: 0 0 0 4px #f5c518; } 100% { box-shadow: 0 0 0 0 transparent; } }
  svg text { font-size: 10px; fill: var(--doux); }
  svg rect.barre { cursor: pointer; }
  .qualif label { display: block; margin: 4px 0; }
  .audio { background: #eef1f4; border-radius: 6px; padding: 8px; font-size: 12px; margin: 6px 0; }

  /* Variante A */
  .a-pipeline { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 4px; }
  .a-roles { display: grid; grid-template-columns: 4fr 3fr; gap: 8px; margin-top: 14px; font-size: 12px; color: var(--doux); }
  .a-roles div { border-top: 3px solid var(--trait); padding-top: 3px; }
  .a-compteur { background: #fff; border: 1px solid var(--trait); border-top: 5px solid; border-radius: 8px; padding: 10px; text-align: left; }
  .a-compteur:hover { box-shadow: 0 2px 8px #0002; }
  .a-compteur .n { font-size: 26px; font-weight: 700; display: block; }
  .a-compteur .action { font-size: 11px; color: var(--doux); }
  .a-retour { margin-bottom: 8px; }
  .a-lot { display: flex; gap: 8px; align-items: center; margin: 8px 0; }

  /* Variante B */
  .b-grille { display: grid; grid-template-columns: 230px 1fr; gap: 16px; }
  .b-filtre { display: flex; width: 100%; justify-content: space-between; align-items: center; margin-bottom: 4px; border-left: 5px solid; text-align: left; }
  .b-filtre.actif { background: #24292f; color: #fff; }
  .b-filtre .n { font-weight: 700; }
  .b-filtre.vide { opacity: .4; }
  .b-chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .b-chip { background: #e8e6df; border-radius: 12px; padding: 2px 10px; font-size: 12px; }
  .b-ligne-ouverte td { background: #fafaf7; }

  /* Variante C */
  .c-onglets { display: flex; gap: 0; border-bottom: 2px solid var(--trait); margin-bottom: 14px; }
  .c-onglets button { border: 0; border-radius: 0; background: none; padding: 8px 16px; font-weight: 600; color: var(--doux); border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .c-onglets button.actif { color: var(--texte); border-bottom-color: #24292f; }
  .c-entonnoir { display: flex; align-items: stretch; gap: 0; margin-bottom: 14px; }
  .c-etape { flex: 1; padding: 10px 14px; background: #fff; border: 1px solid var(--trait); text-align: left; border-radius: 0; position: relative; }
  .c-etape:first-child { border-radius: 8px 0 0 8px; } .c-etape:last-child { border-radius: 0 8px 8px 0; }
  .c-etape.actif { outline: 3px solid #24292f; outline-offset: -3px; z-index: 1; }
  .c-etape .n { font-size: 30px; font-weight: 700; display: block; }
  .c-corps { display: grid; grid-template-columns: 1fr; gap: 14px; }
  .c-annee { margin: 10px 0 4px; font-weight: 700; font-size: 13px; }
  .c-emi { display: inline-block; margin: 2px; padding: 3px 8px; border-radius: 4px; background: #fff; border: 1px solid var(--trait); font-size: 12px; cursor: pointer; }
  .c-emi:hover { border-color: #24292f; }
  .c-fiche { position: fixed; top: 0; right: 0; bottom: 0; width: 420px; background: #fff; box-shadow: -4px 0 16px #0003; padding: 18px; overflow: auto; transform: translateX(105%); transition: transform .2s; z-index: 20; }
  .c-fiche.ouverte { transform: none; }
  .c-fiche h3 { margin: 0 0 4px; }
  .c-histo-maturite { display: flex; gap: 2px; margin: 10px 0; }
  .c-histo-maturite div { flex: 1; height: 8px; border-radius: 2px; background: #eee; }

  /* Second tour (#85) */
  #bulle { position: fixed; display: none; background: #24292f; color: #fff; padding: 8px 10px; border-radius: 6px; font-size: 12px; pointer-events: none; z-index: 40; max-width: 300px; box-shadow: 0 4px 14px #0004; }
  #bulle .doux { color: #c9ccd1; }
  .b-chip input { margin: 0 2px 0 0; }
  .b-ecran { display: flex; flex-direction: column; min-height: 400px; }
  .b-haut { flex: none; padding-bottom: 8px; border-bottom: 2px solid var(--trait); }
  .b-haut .a-pipeline { margin-top: 10px; }
  .b-haut .a-compteur { padding: 6px 10px; } .b-haut .a-compteur .n { font-size: 20px; }
  .b-liste { flex: 1; overflow: auto; position: relative; padding: 0 2px 8px; }
  a.lien { color: inherit; text-decoration: none; } a.lien:hover { text-decoration: underline; text-decoration-color: var(--doux); }
  a.lien::after { content: " ↗"; font-size: 11px; color: var(--doux); }
  th.triable { cursor: pointer; user-select: none; } th.triable:hover { color: var(--texte); }
  .journal { background: #f3f1ea; border-radius: 6px; padding: 6px 8px; margin: 6px 0; font-size: 12px; }
  .voies { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 6px; font-size: 12px; }
  .voies > div { border: 1px solid var(--trait); border-radius: 6px; padding: 6px; } .voies button { margin-top: 4px; }
  .b-an { margin-top: 0; margin-bottom: 10px; background: #fff; border: 1px solid var(--trait); border-radius: 8px; padding: 6px 10px; transition: box-shadow .2s; }
  .b-an.vise { box-shadow: 0 0 0 3px #24292f; }
  .b-an-titre { font-weight: 700; display: flex; gap: 8px; align-items: center; }
  .b-barre { display: flex; flex: 1; height: 6px; border-radius: 3px; overflow: hidden; max-width: 260px; }
  .b-emi { padding: 2px 0; font-size: 13px; border-top: 1px solid #f0eee8; }
  .b-act { float: right; } .b-act button { padding: 0 8px; font-size: 12px; }

  /* Barre de bascule du prototype */
  #bascule { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #b3261e; color: #fff; border-radius: 999px; padding: 6px 8px; display: flex; gap: 10px; align-items: center; box-shadow: 0 4px 14px #0005; z-index: 50; font-weight: 600; }
  #bascule button { background: #fff2; color: #fff; border: 0; border-radius: 999px; width: 30px; height: 30px; padding: 0; }
</style>
</head>

const ANNEES = []; for (let a = 1955; a <= 2026; a++) ANNEES.push(a);
// Liens vers lmelp : même hôte que celui qui sert pap (nas923 par VPN, nom AdGuard à
// la maison), port de l'appli visée. Ports et chemins PROVISOIRES, à préciser.
const HOTE = location.hostname;
const LMELP_EMISSION = e => `http://${HOTE}:LMELP_PORT/emissions/${e.id}`;
const BACKOFFICE_IMPORT = e => `http://${HOTE}:BACKOFFICE_PORT/import/${e.id}`;
const journal = {};     // id -> [{date, texte}]  (pistes et échanges, localisé)
const demarches = {};   // id -> "demandé"  (suivi de démarche, localisé)
const ecartes = {};     // id -> motif     (qualification défavorable)

function compter(liste) {
  const n = Object.fromEntries(ETATS.map(e => [e.cle, 0]));
  liste.forEach(e => n[e.etat]++);
  return n;
}
function parAnnee(liste) {
  const m = {}; ANNEES.forEach(a => m[a] = Object.fromEntries(ETATS.map(e => [e.cle, 0])));
  liste.forEach(e => m[e.annee][e.etat]++);
  return m;
}
function avancer(ids, message, vers) {
  const avant = compter(EMISSIONS);
  ids.forEach(id => { const e = EMISSIONS.find(x => x.id === id); e.etat = vers || ETAT[e.etat].suite; e.simule = true; e.depuis = 0; });
  const apres = compter(EMISSIONS);
  const delta = ETATS.filter(s => apres[s.cle] !== avant[s.cle]).map(s => `${s.nom} ${avant[s.cle]}→${apres[s.cle]}`).join(" · ");
  toast((message || `${ids.length} émission(s) avancée(s)`) + (delta ? " — " + delta : ""));
  rendre(true);
}
function toast(t) { const el = document.getElementById("toast"); el.textContent = t; el.classList.add("vu"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("vu"), 3200); }
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const etiquette = cle => `<span class="etiquette" style="background:${couleur(cle)}">${ETAT[cle].nom}</span>`;

// Histogramme : options empilé (par état) ou simple, mise en évidence d'un état / d'années.
function histogramme({ liste, empile = true, surligne = null, annees = null, clicAnnee = null, hauteur = 150 }) {
  const m = parAnnee(liste), L = 1100, H = hauteur, pas = L / ANNEES.length;
  const max = Math.max(1, ...ANNEES.map(a => ETATS.reduce((s, e) => s + m[a][e.cle], 0)));
  let svg = `<svg viewBox="-14 0 ${L + 28} ${H + 18}" width="100%" style="display:block">`;
  ANNEES.forEach((a, i) => {
    let y = H; const x = i * pas + 1, w = pas - 2;
    const total = ETATS.reduce((s, e) => s + m[a][e.cle], 0);
    const horsAnnee = annees && !annees.has(a);
    if (empile) {
      ETATS.forEach(e => {
        const h = m[a][e.cle] / max * H; if (!h) return; y -= h;
        const pale = (surligne && surligne !== e.cle) || horsAnnee;
        svg += `<rect class="barre" data-a="${a}" x="${x}" y="${y}" width="${w}" height="${h}" fill="${couleur(e.cle)}" opacity="${pale ? .18 : 1}"><title>${a} — ${e.nom} : ${m[a][e.cle]}</title></rect>`;
      });
    } else {
      const h = total / max * H, hs = surligne ? m[a][surligne] / max * H : h;
      svg += `<rect class="barre" data-a="${a}" x="${x}" y="${H - h}" width="${w}" height="${h}" fill="#cfccc3" opacity="${horsAnnee ? .35 : 1}"><title>${a} : ${total} émission(s)</title></rect>`;
      if (hs) svg += `<rect class="barre" data-a="${a}" x="${x}" y="${H - hs}" width="${w}" height="${hs}" fill="${surligne ? couleur(surligne) : "#55595f"}" opacity="${horsAnnee ? .35 : 1}"><title>${a}${surligne ? " — " + ETAT[surligne].nom + " : " + m[a][surligne] : ""}</title></rect>`;
    }
    if (a % 5 === 0) svg += `<text x="${x + w / 2}" y="${H + 13}" text-anchor="middle">${a}</text>`;
  });
  svg += "</svg>";
  const div = document.createElement("div"); div.innerHTML = svg;
  if (clicAnnee) div.querySelectorAll("rect.barre").forEach(r => r.addEventListener("click", ev => clicAnnee(+r.dataset.a, ev)));
  return div;
}
function legende() { return `<div class="doux" style="margin-top:4px">` + ETATS.map(e => `<span style="margin-right:12px"><span class="pastille" style="background:${couleur(e.cle)}"></span>${e.nom}</span>`).join("") + `</div>`; }

// Panneau d'action d'une émission (partagé : l'action, pas la mise en page).
function panneauAction(e, fini) {
  const s = ETAT[e.etat], div = document.createElement("div");
  if (e.etat === "sans" || e.etat === "localise") {
    const j = journal[e.id] || [];
    div.innerHTML = `${e.etat === "localise" ? `<div class="doux">Sources : ${e.sources.join(", ")}</div>` : ""}
      ${j.length ? `<div class="journal">${j.map(x => `<div><b>${x.date}</b> ${esc(x.texte)}</div>`).join("")}</div>` : ""}
      <div class="voies">
        <div><b>${e.etat === "sans" ? "Une piste" : "Un échange"}</b> <span class="doux">${e.etat === "sans" ? "(passionné, archives… → localisé)" : "(reste localisé)"}</span><br>
          <input class="piste" placeholder="ex. M. X a la cassette de cette date, contacté via DVDClassik" style="width:100%"><button class="b-piste">${e.etat === "sans" ? "Noter la piste" : "Noter l'échange"}</button></div>
        <div><b>Une URL</b> <span class="doux">(→ téléchargeable)</span><br><input class="url" placeholder="https://…" style="width:100%"><button class="b-url">Enregistrer l'URL</button></div>
        <div><b>Un fichier</b> <span class="doux">(→ rapatrié)</span><br><input type="file"><input class="prov" placeholder="provenance" style="width:100%"><button class="b-fic">Téléverser</button></div>
      </div>`;
    div.querySelector(".b-piste").onclick = () => { const t = div.querySelector(".piste").value.trim() || "piste sans détail";
      (journal[e.id] ??= []).push({ date: "2026-11-20", texte: t });
      if (e.etat === "sans") { e.sources = [...e.sources, "piste"]; avancer([e.id], `${e.date} : piste notée`, "localise"); } else { toast("Échange noté"); rendre(); }
      fini && fini(); };
    div.querySelector(".b-url").onclick = () => { e.integral = div.querySelector(".url").value || "https://…"; avancer([e.id], `${e.date} : URL enregistrée`, "telechargeable"); fini && fini(); };
    div.querySelector(".b-fic").onclick = () => { avancer([e.id], `${e.date} téléversé`, "rapatrie"); fini && fini(); };
  } else if (e.etat === "telechargeable") {
    div.innerHTML = `<p class="doux">${esc(e.integral)}</p><button class="primaire">Télécharger sur le NAS</button>`;
    div.querySelector("button").onclick = ev => { ev.target.disabled = true; ev.target.textContent = "Téléchargement…"; setTimeout(() => { avancer([e.id], `${e.date} rapatrié`); fini && fini(); }, 700); };
  } else if (e.etat === "rapatrie") {
    div.innerHTML = `<div class="audio">▶ ━━━━━━○──────── 12:40 / ${esc(e.duree || "?")} &nbsp;(lecteur simulé)</div>
      <div class="qualif"><label><input type="checkbox"> correspond à l'émission (date, titre)</label>
      <label><input type="checkbox"> littéraire</label><label><input type="checkbox"> intégral (début et fin présents)</label>
      <label><input type="checkbox"> son exploitable</label></div>
      ${ecartes[e.id] ? `<p class="doux">Déjà écarté : ${esc(ecartes[e.id])}</p>` : ""}
      <button class="primaire">Qualifier (favorable)</button> <button>Écarter</button>`;
    const [ok, non] = div.querySelectorAll("button"), cases = [...div.querySelectorAll("input")];
    const maj = () => ok.disabled = !cases.every(c => c.checked); cases.forEach(c => c.onchange = maj); maj();
    ok.onclick = () => { avancer([e.id], `${e.date} qualifié`); fini && fini(); };
    non.onclick = () => { ecartes[e.id] = cases.filter(c => !c.checked).map(c => c.parentNode.textContent.trim()).join(", ") || "écarté"; toast(`${e.date} écarté : reste rapatrié, marqué`); rendre(); fini && fini(); };
  } else if (e.etat === "qualifie") {
    div.innerHTML = `<p class="doux">Copie dans audios/${e.annee}/ et fiche dans pap_remises.</p><button class="primaire">Mettre à disposition de lmelp</button>`;
    div.querySelector("button").onclick = () => { avancer([e.id], `${e.date} mis à disposition`); fini && fini(); };
  } else if (e.etat === "valide") {
    div.innerHTML = `<p class="doux">En attente : lmelp le prendra à son rythme (lecture seule).</p><button>(démo) lmelp l'a pris</button>`;
    div.querySelector("button").onclick = () => { avancer([e.id], `${e.date} entré dans lmelp`); fini && fini(); };
  } else {
    div.innerHTML = `<p class="doux">Dans lmelp (lecture seule).</p>`;
  }
  return div;
}
const marques = e => (journal[e.id] ? `<span class="simule">${journal[e.id].length} échange(s)</span>` : "") + (e.simule ? `<span class="simule">simulé</span>` : "") + (demarches[e.id] ? `<span class="simule">demandé</span>` : "") + (ecartes[e.id] ? `<span class="simule">écarté</span>` : "");

// ---------- Page de travail d'un état : colonnes selon l'état, triables ----------
const P = { page: null, choix: new Set(), annee: null, tri: "depuis", sens: -1 };
function ouvrirPage(cle, annee) { P.page = cle; P.choix.clear(); P.annee = annee || null; P.tri = ETAT[cle].action ? "depuis" : "date"; P.sens = -1; rendre(); scrollTo(0, 0); }
const titreLien = e => e.etat === "lmelp" ? `<a class="lien" href="${LMELP_EMISSION(e)}" target="_blank" title="ouvrir dans lmelp (URL provisoire)">${esc(e.titre)}</a>`
  : e.etat === "valide" ? `<a class="lien" href="${BACKOFFICE_IMPORT(e)}" target="_blank" title="importer dans le back-office lmelp (URL provisoire)">${esc(e.titre)}</a>` : esc(e.titre);
function colonnes(cle) {
  const c = [
    { k: "date", t: "Date", v: e => e.date, h: e => e.date + marques(e) },
    { k: "titre", t: "Titre", v: e => e.titre, h: titreLien },
    { k: "themes", t: "Thèmes", v: e => e.themes.join(","), h: e => `<span class="doux">${e.themes.join(", ")}</span>` },
  ];
  if (cle !== "lmelp") c.push({ k: "sources", t: "Sources", v: e => e.sources.join(","), h: e => `<span class="doux">${e.sources.join(", ")}</span>` });
  if (cle !== "lmelp") c.push({ k: "depuis", t: "Depuis", v: e => e.depuis, h: depuis });
  return c;
}
function pageEtat(racine) {
  const s = ETAT[P.page], cols = colonnes(P.page), avecAction = !!s.action;
  const col = cols.find(c => c.k === P.tri) || cols[0];
  const tous = EMISSIONS.filter(e => e.etat === P.page), liste = tous.filter(e => !P.annee || e.annee === P.annee)
    .sort((a, b) => { const x = col.v(a), y = col.v(b); return (x < y ? -1 : x > y ? 1 : 0) * P.sens; });
  racine.innerHTML = `<button class="a-retour">← Accueil</button>
    <div class="carte"><h2 style="margin-top:0"><span class="pastille" style="background:${couleur(s.cle)}"></span>${s.nom} : ${liste.length} émission(s) ${P.annee ? `en ${P.annee} <button id="tout">× toutes les années</button>` : ""}</h2><div id="h"></div>
    <div class="doux">Cliquer une année filtre la liste. ${s.cle === "lmelp" ? "Le titre ouvre l'émission dans lmelp." : s.cle === "valide" ? "Le titre ouvre l'import de l'émission dans le back-office lmelp." : ""}</div></div>
    ${s.lot ? `<div class="a-lot"><button class="primaire" id="lot">${s.action} : sélection (<span id="nsel">0</span>)</button><button id="lottout">${s.action} : tout (${liste.length})</button></div>` : ""}
    <div class="carte" style="margin-top:8px"><table><thead><tr>${s.lot ? "<th><input type=checkbox id=tous></th>" : ""}${cols.map(c => `<th class="triable" data-k="${c.k}">${c.t}${P.tri === c.k ? (P.sens > 0 ? " ▲" : " ▼") : ""}</th>`).join("")}${avecAction ? "<th>Action</th>" : ""}</tr></thead><tbody></tbody></table></div>`;
  racine.querySelector(".a-retour").onclick = () => { P.page = null; rendre(); };
  racine.querySelector("#tout")?.addEventListener("click", () => { P.annee = null; rendre(); });
  racine.querySelectorAll("th.triable").forEach(th => th.onclick = () => { P.sens = P.tri === th.dataset.k ? -P.sens : (th.dataset.k === "depuis" ? -1 : 1); P.tri = th.dataset.k; rendre(); });
  racine.querySelector("#h").append(histogramme({ liste: tous, empile: false, surligne: P.page, annees: P.annee ? new Set([P.annee]) : null, hauteur: 90, clicAnnee: a => { P.annee = P.annee === a ? null : a; rendre(); } }));
  const tb = racine.querySelector("tbody");
  liste.slice(0, 200).forEach(e => {
    const tr = document.createElement("tr");
    tr.innerHTML = `${s.lot ? `<td><input type=checkbox ${P.choix.has(e.id) ? "checked" : ""}></td>` : ""}${cols.map(c => `<td>${c.h(e)}</td>`).join("")}${avecAction ? "<td></td>" : ""}`;
    if (s.lot) tr.querySelector("input").onchange = ev => { ev.target.checked ? P.choix.add(e.id) : P.choix.delete(e.id); racine.querySelector("#nsel").textContent = P.choix.size; };
    if (avecAction) boutonAction(e, tr.lastElementChild);
    tb.append(tr);
  });
  if (liste.length > 200) tb.insertAdjacentHTML("beforeend", `<tr><td colspan=8 class=doux>… ${liste.length - 200} de plus</td></tr>`);
  if (s.lot) {
    racine.querySelector("#nsel").textContent = P.choix.size;
    racine.querySelector("#tous").onchange = ev => { liste.forEach(e => ev.target.checked ? P.choix.add(e.id) : P.choix.delete(e.id)); rendre(); };
    racine.querySelector("#lot").onclick = () => { const ids = [...P.choix]; P.choix.clear(); if (ids.length) avancer(ids, `${s.action} : ${ids.length} en lot`); };
    racine.querySelector("#lottout").onclick = () => { if (confirm(`${s.action} : les ${liste.length} émissions ?`)) avancer(liste.map(e => e.id), `${s.action} : ${liste.length} en lot`); };
  }
}

// ---------- Éléments communs de l'accueil ----------
const depuis = e => { const d = e.depuis; const c = d >= 45 ? "#b3261e" : d >= 21 ? "#9a6700" : "var(--doux)"; return `<span style="color:${c};white-space:nowrap">${d} j</span>`; };
function boutonAction(e, td) {
  const s = ETAT[e.etat];
  if (!s.action && s.cle !== "valide") return;
  const b = document.createElement("button"); b.textContent = s.action || "détail";
  const cible = td.classList.contains("b-act") ? td.parentNode : td;   // dans la frise, le panneau s'ouvre sous la ligne
  b.onclick = () => { b.remove(); const p = panneauAction(e); p.style.margin = "6px 0 8px 18px"; cible.append(p); }; td.append(b);
}
function compteurs(n, survol, annee, sansRoles) {
  const html = `${sansRoles ? "" : `<div class="a-roles"><div style="border-color:var(--localise)">Archéologue — jusqu'à rapatrié</div><div style="border-color:var(--qualifie)">Exploitant lmelp — de rapatrié à lmelp</div></div>`}
    <div class="a-pipeline">${ETATS.map(e => `<button class="a-compteur" data-e="${e.cle}" style="border-top-color:${couleur(e.cle)}"><span class="n">${n[e.cle]}</span>${e.nom}<br><span class="action">${e.action ? "→ " + e.action : "lecture seule"}</span></button>`).join("")}</div>`;
  const div = document.createElement("div"); div.innerHTML = html;
  div.querySelectorAll(".a-compteur").forEach(b => {
    b.onclick = () => ouvrirPage(b.dataset.e, annee);
    if (survol) { b.onmouseenter = () => survol(b.dataset.e); b.onmouseleave = () => survol(null); }
  });
  return div;
}
// Histogramme empilé avec zones de survol par année (une colonne transparente pleine hauteur).
function histoSurvol({ liste, hauteur = 170, surligne = null, annees = null, survol, clic }) {
  const div = histogramme({ liste, hauteur, surligne, annees });
  const svg = div.querySelector("svg"), pas = 1100 / ANNEES.length;
  ANNEES.forEach((a, i) => {
    const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    Object.entries({ x: i * pas, y: 0, width: pas, height: hauteur, fill: "transparent", class: "zone" }).forEach(([k, v]) => r.setAttribute(k, v));
    r.style.cursor = clic ? "pointer" : "default";
    r.addEventListener("mouseenter", ev => survol && survol(a, ev));
    r.addEventListener("mousemove", ev => survol && survol(a, ev));
    r.addEventListener("mouseleave", () => survol && survol(null));
    if (clic) r.addEventListener("click", ev => clic(a, ev));
    svg.append(r);
  });
  svg.querySelectorAll("title").forEach(t => t.remove());   // l'infobulle remplace les title natifs
  return div;
}
function bulle() { let b = document.getElementById("bulle"); if (!b) { b = document.createElement("div"); b.id = "bulle"; document.body.append(b); } return b; }
function cacherBulle() { bulle().style.display = "none"; }
function montrerBulle(html, ev) { const b = bulle(); b.innerHTML = html; b.style.display = "block"; const x = Math.min(ev.clientX + 14, innerWidth - b.offsetWidth - 8); b.style.left = x + "px"; b.style.top = (ev.clientY + 14) + "px"; }
const parEtat = l => ETATS.filter(s => l.some(e => e.etat === s.cle)).map(s => `<div><span class="pastille" style="background:${couleur(s.cle)}"></span>${s.nom} <b style="float:right;margin-left:12px">${l.filter(e => e.etat === s.cle).length}</b></div>`).join("");

// ---------- Variante A : infobulle détaillée, le clic sur une année filtre la liste globale ----------
const A = { nom: "Infobulle détaillée + catalogue filtrable", annee: null, etats: new Set(), q: "", page: 0 };
A.rendre = function (racine) {
  const n = compter(EMISSIONS);
  racine.innerHTML = `<div class="carte"><h2 style="margin-top:0">Émissions par année, par état de leur meilleur enregistrement</h2><div id="h"></div>${legende()}
      <div class="doux">Survol : le détail de l'année. Clic : filtre la liste en bas.</div></div><div id="cpt"></div>
    <h2>Toutes les émissions</h2>
    <div class="a-lot" id="filtres"></div><div class="carte"><table><thead><tr><th>Date</th><th>Titre</th><th>Thèmes</th><th>État</th><th>Depuis</th><th>Action</th></tr></thead><tbody></tbody></table><div id="pages" class="a-lot"></div></div>`;
  racine.querySelector("#h").append(histoSurvol({ liste: EMISSIONS, annees: A.annee ? new Set([A.annee]) : null,
    survol: (a, ev) => { if (!a) return cacherBulle(); const l = EMISSIONS.filter(e => e.annee === a);
      montrerBulle(`<b>${a}</b> — ${l.length} émission(s)<div style="margin:6px 0">${parEtat(l)}</div><div class="doux">${l.slice(0, 8).map(e => `${e.date.slice(5)} ${esc(e.titre).slice(0, 34)}`).join("<br>")}${l.length > 8 ? `<br>… ${l.length - 8} de plus` : ""}</div>`, ev); },
    clic: a => { A.annee = A.annee === a ? null : a; A.page = 0; cacherBulle(); rendre(); } }));
  racine.querySelector("#cpt").append(compteurs(n));
  const f = racine.querySelector("#filtres");
  f.innerHTML = `${ETATS.map(s => `<label class="b-chip" style="border-left:4px solid ${couleur(s.cle)}"><input type=checkbox data-e="${s.cle}" ${A.etats.has(s.cle) ? "checked" : ""}> ${s.nom}</label>`).join("")}
    ${A.annee ? `<span class="b-chip">année ${A.annee} <button id="xa">×</button></span>` : ""}<input id="q" placeholder="titre, date…" value="${esc(A.q)}" style="margin-left:auto">`;
  f.querySelectorAll("input[data-e]").forEach(c => c.onchange = () => { c.checked ? A.etats.add(c.dataset.e) : A.etats.delete(c.dataset.e); A.page = 0; rendre(); });
  f.querySelector("#xa")?.addEventListener("click", () => { A.annee = null; rendre(); });
  const q = f.querySelector("#q"); q.oninput = () => { A.q = q.value; A.page = 0; remplir(); };
  const tb = racine.querySelector("tbody");
  function remplir() {
    const l = EMISSIONS.filter(e => (!A.annee || e.annee === A.annee) && (!A.etats.size || A.etats.has(e.etat)) && (!A.q || (e.date + " " + e.titre).toLowerCase().includes(A.q.toLowerCase()))).sort((a, b) => b.date.localeCompare(a.date));
    tb.innerHTML = ""; const t = 50, debut = A.page * t;
    l.slice(debut, debut + t).forEach(e => { const tr = document.createElement("tr");
      tr.innerHTML = `<td>${e.date}${marques(e)}</td><td>${esc(e.titre)}<div class="doux">${esc(e.animateur)}</div></td><td class="doux">${e.themes.join(", ")}</td><td>${etiquette(e.etat)}</td><td>${depuis(e)}</td><td></td>`;
      boutonAction(e, tr.lastElementChild); tb.append(tr); });
    const pg = racine.querySelector("#pages"); const np = Math.ceil(l.length / t);
    pg.innerHTML = `<span class="doux">${l.length} émission(s) · page ${A.page + 1}/${Math.max(np, 1)}</span><button id="pp" ${A.page ? "" : "disabled"}>◀</button><button id="ps" ${A.page + 1 < np ? "" : "disabled"}>▶</button>`;
    pg.querySelector("#pp").onclick = () => { A.page--; remplir(); }; pg.querySelector("#ps").onclick = () => { A.page++; remplir(); };
  }
  remplir();
};

// ---------- Variante B : écran fixe (graphique + états) et liste qui défile dessous ----------
const B = { nom: "Survol synchronisé, frise chronologique", etat: null, annee: null };
B.rendre = function (racine) {
  const vues = EMISSIONS.filter(e => !B.annee || e.annee === B.annee), n = compter(vues);
  racine.innerHTML = `<div class="b-ecran"><div class="b-haut"><div class="carte"><h2 style="margin-top:0">Émissions par année ${B.annee ? `<button id="xa">${B.annee} ×</button>` : ""}<span id="lecture" class="doux" style="font-weight:400"></span></h2><div id="h"></div>${legende()}</div><div id="cpt"></div></div>
    <div class="b-liste" id="frise"></div></div>`;
  const ecran = racine.querySelector(".b-ecran"), frise = racine.querySelector("#frise");
  ecran.style.height = (innerHeight - ecran.getBoundingClientRect().top - 72) + "px";
  racine.querySelector("#xa")?.addEventListener("click", () => { B.annee = null; rendre(); });
  const repos = () => B.annee ? ` — ${vues.length} émission(s) en ${B.annee}` : " — survoler une année pour s'y rendre, cliquer pour filtrer";
  const dessiner = () => { const h = racine.querySelector("#h"); h.innerHTML = ""; h.append(histoSurvol({ liste: EMISSIONS, surligne: B.etat, hauteur: 120, annees: B.annee ? new Set([B.annee]) : null,
    clic: a => { B.annee = B.annee === a ? null : a; rendre(); },
    survol: a => { const lec = racine.querySelector("#lecture");
      frise.querySelectorAll(".b-an.vise").forEach(x => x.classList.remove("vise"));
      if (!a) { lec.textContent = repos(); return; }
      const l = EMISSIONS.filter(e => e.annee === a);
      lec.innerHTML = ` — <b>${a}</b> : ${l.length} · ` + ETATS.filter(s => l.some(e => e.etat === s.cle)).map(s => `<span class="pastille" style="background:${couleur(s.cle)}"></span>${l.filter(e => e.etat === s.cle).length} ${s.nom}`).join(" · ");
      const cible = frise.querySelector(`.b-an[data-a="${a}"]`);
      if (cible) { cible.classList.add("vise"); frise.scrollTop = cible.offsetTop; } } })); };
  dessiner(); racine.querySelector("#lecture").textContent = repos();
  racine.querySelector("#cpt").append(compteurs(n, cle => { B.etat = cle; dessiner(); frise.querySelectorAll(".b-emi").forEach(x => x.style.opacity = !cle || x.dataset.e === cle ? 1 : .2); }, B.annee, true));
  const groupes = {};
  vues.forEach(e => (groupes[e.annee] ??= []).push(e));
  Object.keys(groupes).sort((a, b) => b - a).forEach(a => {
    const l = groupes[a].sort((x, y) => y.date.localeCompare(x.date));
    const bloc = document.createElement("div"); bloc.className = "b-an"; bloc.dataset.a = a;
    bloc.innerHTML = `<div class="b-an-titre">${a} <span class="doux">${l.length}</span> <span class="b-barre">${ETATS.map(s => { const k = l.filter(e => e.etat === s.cle).length; return k ? `<i style="flex:${k};background:${couleur(s.cle)}"></i>` : ""; }).join("")}</span></div>`;
    l.forEach(e => { const r = document.createElement("div"); r.className = "b-emi"; r.dataset.e = e.etat;
      r.innerHTML = `<span class="pastille" style="background:${couleur(e.etat)}"></span><span class="doux" style="width:44px;display:inline-block">${e.date.slice(5)}</span> ${titreLien(e)} <span class="doux">· ${ETAT[e.etat].nom}${ETAT[e.etat].action ? " · " + depuis(e) : ""}</span>${marques(e)}<span class="b-act"></span>`;
      boutonAction(e, r.querySelector(".b-act")); bloc.append(r); });
    frise.append(bloc);
  });
};

// ---------- Variante C : infobulle compacte, la liste est une file « à traiter » triée par ancienneté ----------
const C = { nom: "File à traiter, du plus ancien au plus récent", role: "tout", annee: null, catalogue: false };
C.rendre = function (racine) {
  const n = compter(EMISSIONS);
  racine.innerHTML = `<div class="carte"><h2 style="margin-top:0">Émissions par année, par état</h2><div id="h"></div>${legende()}<div class="doux">Survol : chiffres de l'année. Clic : limite la file à cette année.</div></div><div id="cpt"></div>
    <div class="c-onglets" style="margin-top:18px">${[["tout", "Tout ce qui attend une action"], ["archeologue", "Archéologue"], ["exploitant", "Exploitant lmelp"], ["catalogue", "Catalogue complet"]].map(([k, t]) => `<button data-o="${k}" class="${(C.catalogue ? "catalogue" : C.role) === k ? "actif" : ""}">${t}</button>`).join("")}
      ${C.annee ? `<span class="b-chip" style="align-self:center;margin-left:auto">${C.annee} <button id="xa">×</button></span>` : ""}</div>
    <div class="carte"><table><thead><tr><th>Depuis</th><th>État</th><th>Date</th><th>Titre</th><th>Action</th></tr></thead><tbody></tbody></table></div>`;
  racine.querySelector("#h").append(histoSurvol({ liste: EMISSIONS, annees: C.annee ? new Set([C.annee]) : null,
    survol: (a, ev) => { if (!a) return cacherBulle(); const l = EMISSIONS.filter(e => e.annee === a); montrerBulle(`<b>${a}</b> — ${l.length}<div style="margin-top:4px">${parEtat(l)}</div>`, ev); },
    clic: a => { C.annee = C.annee === a ? null : a; cacherBulle(); rendre(); } }));
  racine.querySelector("#cpt").append(compteurs(n));
  racine.querySelectorAll(".c-onglets button[data-o]").forEach(b => b.onclick = () => { C.catalogue = b.dataset.o === "catalogue"; if (!C.catalogue) C.role = b.dataset.o; rendre(); });
  racine.querySelector("#xa")?.addEventListener("click", () => { C.annee = null; rendre(); });
  let l = EMISSIONS.filter(e => !C.annee || e.annee === C.annee);
  if (C.catalogue) l.sort((a, b) => b.date.localeCompare(a.date));
  else l = l.filter(e => ETAT[e.etat].action && (C.role === "tout" || ETAT[e.etat].role === C.role)).sort((a, b) => b.depuis - a.depuis);
  const tb = racine.querySelector("tbody");
  l.slice(0, 100).forEach(e => { const tr = document.createElement("tr");
    tr.innerHTML = `<td>${ETAT[e.etat].action ? depuis(e) : ""}</td><td>${etiquette(e.etat)}</td><td>${e.date}${marques(e)}</td><td>${esc(e.titre)}</td><td></td>`;
    boutonAction(e, tr.lastElementChild); tb.append(tr); });
  if (l.length > 100) tb.insertAdjacentHTML("beforeend", `<tr><td colspan=5 class=doux>… ${l.length - 100} de plus</td></tr>`);
};

// ---------- Bascule de variantes ----------
const VARIANTES = { A, B, C }, CLES = Object.keys(VARIANTES);
let variante = new URLSearchParams(location.search).get("variant") || "B";
if (!VARIANTES[variante]) variante = "B";
function rendre(flash) {
  const n = compter(EMISSIONS);
  document.getElementById("resume").textContent = `${EMISSIONS.length} émissions · ${n.lmelp} dans lmelp · ${n.valide} valides · PROTOTYPE : rapatrié/qualifié/valide simulés`;
  document.getElementById("nom").textContent = `${variante} (${VARIANTES[variante].nom})`;
  const r = document.getElementById("racine"); cacherBulle();
  P.page ? pageEtat(r) : VARIANTES[variante].rendre(r);
  if (flash) r.querySelectorAll(".a-compteur").forEach(x => x.classList.add("flash"));
}
function aller(d) {
  variante = CLES[(CLES.indexOf(variante) + d + CLES.length) % CLES.length];
  const u = new URL(location); u.searchParams.set("variant", variante); history.replaceState(null, "", u);
  rendre(); scrollTo(0, 0);
}
document.getElementById("prec").onclick = () => aller(-1);
document.getElementById("suiv").onclick = () => aller(1);
addEventListener("resize", () => { if (variante === "B" && !P.page) rendre(); });
addEventListener("keydown", ev => {
  if (ev.target.closest("input, textarea, [contenteditable]")) return;
  if (ev.key === "ArrowLeft") aller(-1); if (ev.key === "ArrowRight") aller(1);
});
rendre();
</script>
