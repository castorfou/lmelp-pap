name: 🐳 Image Docker

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'README.md'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
      - 'scripts/fumee_image.sh'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'README.md'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
      - 'scripts/fumee_image.sh'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/castorfou/lmelp-pap

jobs:
  image:
    name: 🏗️ Build, fumée (push et mise à jour du NAS sur main)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Construite d'abord sans pousser, chargée dans le daemon local, pour la
      # fumée : seule l'image révèle ce qui part vraiment (gabarits HTML du
      # paquet compris).
      - name: Build (sans push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: lmelp-pap:fumee
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 💨 Test de fumée de l'image
        run: scripts/fumee_image.sh lmelp-pap:fumee

      # Seulement si la fumée passe ; les couches viennent du cache du build.
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: 🔄 Mise à jour sur le NAS (Watchtower)
        # Watchtower (castorfou/dockers) pull l'image et redémarre le conteneur pap labellisé.
        # Échoue si aucun conteneur ne correspond (scanned=0) ou si la mise à jour échoue.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          WATCHTOWER_TOKEN: ${{ secrets.WATCHTOWER_TOKEN }}
        run: |
          resp=$(curl -fsS --retry 3 --retry-delay 10 --max-time 660 -X POST \
            -H "Authorization: Bearer $WATCHTOWER_TOKEN" \
            "https://watchtower.ascot63.synology.me/v1/update?image=$IMAGE")
          echo "$resp"
          jq -e '.summary.scanned >= 1 and .summary.failed == 0' <<< "$resp"
